acciveloDBT:
  outputs:
    dev:
      dbname: "{{ env_var('DB_BDD') | trim }}"
      host: "{{ env_var('DB_HOST') | trim }}" 
      pass: "{{ env_var('DB_PASS') | trim }}" 
      port: "{{ env_var('DB_PORT') | int }}"
      schema: "{{ env_var('DB_SCHEMA') | trim }}"
      threads: 1
      type: postgres
      user: "{{ env_var('DB_USER') | trim }}"
  target: dev