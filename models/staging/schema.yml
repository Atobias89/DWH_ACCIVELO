version: 2

models:
  - name : stg_info_victime
    columns : 
      - name : victime_id
        constraints:
          - type : primary_key
      - name : gravite_accident
      - name : sexe
      - name : trajet_victime
      - name : equipement_securite
      - name : num_acc
      - name : created_at
      - name : updated_at
  - name :  stg_info_accident
    columns : 
      - name : accident_id
      - name : intersection
      - name : coallision
      - name : luminosite
      - name : meteo
      - name : categorie_accident
      - name : circulation
      - name : nombre_voies
      - name : profil_long_route
      - name : plan_route
      - name : num_acc
      - name : date_accident
      - name : created_at
      - name : updated_at

  - name : stg_info_vehicule
    columns:
      - name : info_vehi_id
        constraints : 
          - type : primary_key
      - name: manoeuvre_vehicule_avant
      - name : vehiculeid
      - name : typevehicules
      - name : info_commune
      - name : created_at
      - name : updated_at
  - name : stg_loc_accident
    columns :
      - name : num_acc
        constraints:
          - type : primary_key
        tests:
          - not_null
      - name : departement
      - name : comune 
      - name : lat
      - name : long