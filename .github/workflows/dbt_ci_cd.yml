name : run dbt with SSH

on:
  push:
    branches : ["main","recette"]
  workflow_dispatch:

jobs:
  test_dbt:
    name: Tester les modèles dbt et scripts python
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
            POSTGRES_USER: test_user
            POSTGRES_PASSWORD: test_password
            POSTGRES_DB: test_db
        options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
        ports : 
            - 5432:5432
    steps:
      - name: récupérer le code
        uses: actions/checkout@v4

      - name: installer python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: installer dbt
        run: |
          pip install dbt-core dbt-postgres
          dbt --version
      - name: Installer les dependances dbt
        run: |
          if [ -f packages.yml ]; then
            dbt deps 
          fi
      
      - name: Debug - verfier les fichiers 
        run :  |
          ls -la
          echo "Vérifications des profiles.yml"
          cat profiles.yml 2>/dev/null || echo "profiles.yml non trouvé"
      
      - name: Install ALL dependencies
        run: |
          pip install --upgrade pip
          
          # Toutes les dépendances en une seule ligne
          pip install \
            pandas \
            numpy \
            sqlalchemy \
            psycopg2-binary \
            requests \
            python-dotenv \
            python-dateutil \
            pytz \
            dbt-core \
            dbt-postgres
          
            # Afficher les versions installées
            echo "=== VERSIONS INSTALLÉES ==="
            pip list
          
            # Vérifier les imports
            echo "=== VÉRIFICATION DES IMPORTS ==="
            python -c "import pandas; print('✅ pandas', pandas.__version__)"
            python -c "import numpy; print('✅ numpy', numpy.__version__)"
            python -c "import sqlalchemy; print('✅ sqlalchemy', sqlalchemy.__version__)"
            python -c "import psycopg2; print('✅ psycopg2', psycopg2.__version__)"
            python -c "import requests; print('✅ requests', requests.__version__)"
            python -c "from dotenv import load_dotenv; print('✅ python-dotenv')"
          

      
      - name: requeter API Departements et communes
        run: python ingestion/main.py
        env:
          DB_HOST: localhost
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_PORT: 5432
          DB_NAME: test_db
          DB_SCHEMA: acciveloDBT
      
      - name: compiler les modèles
        run: python run_dbt.py dbt compile
        env:
          DB_BDD: ${{ secrets.DB_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: compiler les modèles
        run: python run_dbt.py dbt run
        env:
          DB_BDD: ${{ secrets.DB_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
      
      - name: compiler les modèles
        run: python run_dbt.py dbt test
        env:
          DB_BDD: ${{ secrets.DB_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
      
      - name: Afficher les tables créées (debug)
        run: |
          PGPASSWORD=test_password psql -h localhost -U test_user -d test_db -c "\dt dbt_test_ci.*"
        env:
          PGPASSWORD: test_password

  generate_docs:
    name: Générer la documentation
    runs-on: ubuntu-latest
    needs: test_dbt
    if: github.ref == 'refs/heads/main'

    steps:
      - name: récupérer le code
        uses: actions/checkout@v4

      - name: Installer python
        uses: actions/setup-python@5
        with:
          python-version: '3.11'

      - name: Générer la documentation
        run : python run_dbt.py dbt docs generate
        env:
          DB_BDD: ${{ secrets.DB_NAME }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
      
      - name: Uploader la documentation
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: target/      